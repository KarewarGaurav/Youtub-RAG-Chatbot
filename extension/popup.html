<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube RAG Assistant</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      width: 330px;
      height: auto;
      margin: 0;
      padding: 0;
      background-color: #0f0f0f;
      overflow: hidden;
    }
    .popup-container {
      height: auto !important;
      min-height: max-content;
      padding: 14px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .popup-btn {
      width: 100%;
      height: 42px;
      background-color: #ff0000;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
      transition: all 0.2s ease;
    }
    .popup-btn:hover {
      background-color: #cc0000;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="app-container popup-container">
    <!-- Header -->
    <div class="popup-header">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="#FF0000"/>
      </svg>
      <h2 style="font-size: 16px; font-weight: 700; margin: 0; color: #ffffff;">YouTube AI Assistant</h2>
    </div>

    <!-- Active Video Card -->
    <div id="videoCard" class="video-card" style="margin: 0;">
      <div class="video-info">
        <span class="video-icon">🎬</span>
        <div class="video-details">
          <span class="video-label">Current Video:</span>
          <span id="activeVideoId" class="video-id">Detecting...</span>
        </div>
      </div>
    </div>

    <!-- Launch Side Panel Button -->
    <div style="margin-top: 2px;">
      <button id="openSidePanelBtn" class="popup-btn">
        🚀 Open Side Panel Chat
      </button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
